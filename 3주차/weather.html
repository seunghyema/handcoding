<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="weather.css">
  </head>
  <body>
    <div class="weather-dashboard">
      <header class="top-bar">
        <form class="search-form">
          <label for="search-input" class="visually-hidden">장소 검색</label>
          <input
            type="search"
            id="search-input"
            name="city"
            placeholder="장소를 입력하세요"
            autocomplete="off"
          />
          <button type="submit">검색</button>
        </form>
        <div class="place-time">
            <p class="location">Seoul</p>
            <p class="current-time">20:15</p>
        </div>
      </header>
      <p class="loading"></p>
      <main class="main-icon">
        <img src = "cloud.svg" alt="구름 이미지" class="weather-svg">
      </main>
      <footer class="bottom-bar">
        <section class="current">
          <p class="current-label">Weather</p>
            <div class="current-main">
            <p class="current-temp">33°</p>
            <p class="current-date">Monday 16th</p>
            </div>
            <div class="current-extra">
            <span class="current-icon">⛅</span>
            <p class="current-detail">4mph/67°</p>
            </div>
        </section>
        <ul class="forecast">
            <li class="forecast-item">
                <span class="forecast-day">Tue</span>
                <span class="forecast-icon">☀️</span>
                <span class="forecast-temp">31°</span>
            </li>
            <li class="forecast-item">
                <span class="forecast-day">Wed</span>
                <span class="forecast-icon">☀️</span>
                <span class="forecast-temp">31°</span>
            </li>
            <li class="forecast-item">
                <span class="forecast-day">Thu</span>
                <span class="forecast-icon">☀️</span>
                <span class="forecast-temp">31°</span>
            </li>
            <li class="forecast-item">
                <span class="forecast-day">Fri</span>
                <span class="forecast-icon">☀️</span>
                <span class="forecast-temp">31°</span>
            </li>
            <li class="forecast-item">
                <span class="forecast-day">Sat</span>
                <span class="forecast-icon">☀️</span>
                <span class="forecast-temp">31°</span>
            </li>
            <li class="forecast-item">
                <span class="forecast-day">Sun</span>
                <span class="forecast-icon">☀️</span>
                <span class="forecast-temp">31°</span>
            </li>
        </ul>

      </footer>
    </div>
  </body>
</html>
